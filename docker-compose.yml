services:
  db:
    image: mariadb:10.11
    container_name: ${COMPOSE_PROJECT_NAME}-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks:
      - wp-net

  wordpress:
    image: wordpress:latest
    container_name: ${COMPOSE_PROJECT_NAME}-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${HTTP_PORT}:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: ${DB_USER}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
      WORDPRESS_DB_NAME: ${DB_NAME}
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_DEBUG', true);
        define('WP_DEBUG_LOG', true);
        define('WP_DEBUG_DISPLAY', false);
    volumes:
      - ./wordpress:/var/www/html
    networks:
      - wp-net

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: ${COMPOSE_PROJECT_NAME}-pma
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${PMA_PORT}:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      UPLOAD_LIMIT: 256M
    networks:
      - wp-net

  wp-auto-install:
    image: wordpress:cli
    container_name: ${COMPOSE_PROJECT_NAME}-auto-install
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
      wordpress:
        condition: service_started
    volumes:
      - ./wordpress:/var/www/html
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: ${DB_USER}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
      WORDPRESS_DB_NAME: ${DB_NAME}
      WP_URL: ${WP_URL}
      WP_TITLE: ${WP_TITLE}
      WP_ADMIN_USER: ${WP_ADMIN_USER}
      WP_ADMIN_PASSWORD: ${WP_ADMIN_PASSWORD}
      WP_ADMIN_EMAIL: ${WP_ADMIN_EMAIL}
    entrypoint:
      - /bin/sh
      - -c
      - |
        echo "[Auto-Installer] Menunggu file wp-config.php..."
        while [ ! -f /var/www/html/wp-config.php ]; do
          sleep 2
        done
        echo "[Auto-Installer] File wp-config.php ditemukan!"
        
        if wp core is-installed --path=/var/www/html 2>/dev/null; then
          echo "[Auto-Installer] WordPress sudah terinstall sebelumnya."
        else
          echo "[Auto-Installer] Memulai instalasi otomatis WordPress..."
          wp core install \
            --path=/var/www/html \
            --url="$$WP_URL" \
            --title="$$WP_TITLE" \
            --admin_user="$$WP_ADMIN_USER" \
            --admin_password="$$WP_ADMIN_PASSWORD" \
            --admin_email="$$WP_ADMIN_EMAIL" \
            --skip-email
          echo "[Auto-Installer] ✅ WordPress berhasil diinstall otomatis!"
        fi
    networks:
      - wp-net

volumes:
  db_data:

networks:
  wp-net:
